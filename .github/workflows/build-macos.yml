name: Unity macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS Universal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-macOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-macOS-

      - name: Build macOS Universal player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneOSX
          unityVersion: 2021.3.5f1
          buildMethod: Protobot.BuildTools.MacBuild.BuildMacOS

      - name: Compress app bundle
        working-directory: Builds/macOS
        run: |
          test -d Protobot.app
          zip -qry Protobot-macOS.zip Protobot.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Protobot-macOS-Universal
          path: Builds/macOS/Protobot-macOS.zip
          if-no-files-found: error
